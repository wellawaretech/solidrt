[package]
name = "flux"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "flux"
path = "src/lib.rs"

[[bin]]
name = "flux"
path = "src/bin/flux.rs"
required-features = ["compile"]

[[bin]]
name = "fluxc"
path = "src/bin/fluxc.rs"
required-features = ["compile"]

[features]
default = ["compile"]
compile = []

[dependencies]
log = { workspace = true }
rquickjs = { version = "0.11.0", features = ["rust-alloc", "futures", "macro", "loader"] }
tokio = { workspace = true, features = ["sync", "time", "fs", "io-util", "macros", "rt", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
# Pinned to 0.37 on purpose: rusqlite >= 0.40 pulls libsqlite3-sys 0.38, whose
# build.rs uses the still-unstable `cfg_select!` macro and fails on stable rustc
# (1.93.1 here). 0.37 -> libsqlite3-sys 0.35 builds fine. See TODO.md; bump once
# cfg_select is stable on our toolchain.
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
