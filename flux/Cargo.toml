[package]
name = "flux"
version = "0.0.0"
edition = "2021"
license = "MIT"

[lib]
name = "flux"
path = "src/lib.rs"

[[bin]]
name = "flux"
path = "src/bin/flux.rs"
required-features = ["compile"]

[[bin]]
name = "fluxc"
path = "src/bin/fluxc.rs"
required-features = ["compile"]

[[bin]]
name = "fluxrt"
path = "src/bin/fluxrt.rs"

[features]
default = ["compile"]
compile = []

[dependencies]
log = { workspace = true }
rquickjs = { version = "0.12.0", features = ["rust-alloc", "futures", "macro", "loader"] }
tokio = { workspace = true, features = ["sync", "time", "fs", "io-util", "macros", "rt", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-core = "0.3"
percent-encoding = "2"
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
libc = "0.2"
