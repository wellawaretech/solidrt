[package]
name = "flux"
version = "0.0.0"
edition = "2021"
license = "MIT"

[lib]
name = "flux"
path = "src/lib.rs"

[[bin]]
name = "flux"
path = "src/bin/flux.rs"
required-features = ["compile"]

[[bin]]
name = "fluxc"
path = "src/bin/fluxc.rs"
required-features = ["compile"]

[[bin]]
name = "fluxrt"
path = "src/bin/fluxrt.rs"

[features]
default = ["compile"]
compile = []
# The alloy-backed GUI marshalling layer (flux::gui): render-tree / texture /
# raf / camera / microphone bindings. Pulls alloy (SDL + Impeller + GL). Off by
# default so the headless flux runtime and its bins stay GUI-free; lattice turns
# it on.
gui = ["dep:alloy", "dep:taffy", "dep:serde_json", "forge/audio"]
# flux:video (behind forge/video): not a cargo default; see forge/Cargo.toml.
video = ["forge/video"]
# `record` of flux:video (behind forge/video-encode): the encoders, the WebM
# writer and the recorder; implies video. See okf/plans/video-encode.md.
video-encode = ["video", "forge/video-encode"]
# flux:p2p, the `p2p` option of flux:http's serve and the `p2p` capability
# (behind forge/p2p): not a cargo default; see forge/Cargo.toml.
p2p = ["forge/p2p"]
# `serveRelay` of flux:p2p and the `p2p-relay` capability (behind
# forge/p2p-relay), independent of p2p. Not a cargo default; see
# forge/Cargo.toml.
p2p-relay = ["forge/p2p-relay"]
# flux:image transcodeTexture / encodeTexture and the `ktx2` capability
# (behind forge/ktx2): not a cargo default; see forge/Cargo.toml.
ktx2 = ["forge/ktx2"]
# flux:wasm and the `wasm` capability (behind forge/wasm, wasmi): not a cargo
# default; see forge/Cargo.toml.
wasm = ["forge/wasm"]
# The native lane on top (behind forge/wasm-native): wasmtime where the
# target has a backend, wasmi elsewhere; the `wasm-native` capability says
# which this build got.
wasm-native = ["wasm", "forge/wasm-native"]
# flux:test (test, expect), the test host (flux::test) and the `test`
# capability: what `sol test` runs a test file with. The module evaluates
# an embedded JS source, hence `compile`.
# Not a cargo default: the Makefile turns it on for the `flux` binary only,
# so no shipping runtime (fluxrt, the production solidrt) carries it.
test = ["compile", "dep:serde_json"]

[dependencies]
forge = { workspace = true }
alloy = { workspace = true, optional = true }
# Render-tree layout types named by the gui tree/properties bindings. Must match
# the version alloy + lattice pin (0.12.2) so the taffy `Style` type unifies
# across the crate boundary.
taffy = { version = "=0.15.0", optional = true }
log = { workspace = true }
# The test host's records (flux:test), one JSON object per stdout line, and
# the node records of the gui layer (alloy_plugins/inspect.rs).
serde_json = { version = "=1.0.154", optional = true }
rquickjs = { version = "=0.14.0", features = ["rust-alloc", "futures", "macro", "loader"] }
# rquickjs requires its core, sys and macro crates with a caret (`0.14.0`,
# any 0.14.x), so they are pinned here as well: the sys crate is the engine,
# which decides whether bytecode loads, and a custom runtime (a build outside
# this Cargo.lock) must resolve the same one as the fluxc beside it.
rquickjs-core = { version = "=0.14.0", default-features = false }
rquickjs-macro = "=0.14.0"
rquickjs-sys = { version = "=0.14.0", default-features = false }
tokio = { workspace = true, features = ["sync", "time", "fs", "io-util", "macros", "rt", "net", "signal", "process"] }
# The capability cores and every transport crate (reqwest, hyper, iroh,
# fastwebsockets, rusqlite, ...) live in forge; flux names only the crates the
# marshalling layer itself is written against.

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
libc = "=0.2.190"
