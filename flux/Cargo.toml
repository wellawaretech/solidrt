[package]
name = "flux"
version = "0.0.0"
edition = "2021"
license = "MIT"

[lib]
name = "flux"
path = "src/lib.rs"

[[bin]]
name = "flux"
path = "src/bin/flux.rs"
required-features = ["compile"]

[[bin]]
name = "fluxc"
path = "src/bin/fluxc.rs"
required-features = ["compile"]

[[bin]]
name = "fluxrt"
path = "src/bin/fluxrt.rs"

[features]
default = ["compile"]
compile = []
# The alloy-backed GUI marshalling layer (flux::gui): render-tree / texture /
# raf / camera / microphone bindings. Pulls alloy (SDL + Impeller + GL). Off by
# default so the headless flux runtime and its bins stay GUI-free; lattice turns
# it on.
gui = ["dep:alloy", "dep:taffy"]
# Video frame scheduling on the engine timeline (paced clock) with standing
# frame demand while a player is mid-playback, instead of wall-clock selection
# with demand only on upload. Measured on a 50 Hz TV: missed present slots
# 11% -> 0.13%, content locked frame-for-frame. Off by default until the
# residual ~1/s idle-tick hitch is resolved; see okf/backlog/video-playback.md.
# flux:video (behind forge/video): opt-in, incomplete; see forge/Cargo.toml.
video = ["forge/video"]
video-timeline-pacing = ["video"]

[dependencies]
forge = { workspace = true }
alloy = { workspace = true, optional = true }
# Render-tree layout types named by the gui tree/properties bindings. Must match
# the version alloy + lattice pin (0.12.1) so the taffy `Style` type unifies
# across the crate boundary.
taffy = { version = "0.12.1", optional = true }
log = { workspace = true }
rquickjs = { version = "0.12.0", features = ["rust-alloc", "futures", "macro", "loader"] }
tokio = { workspace = true, features = ["sync", "time", "fs", "io-util", "macros", "rt", "net", "signal", "process"] }
# The capability cores (and their reqwest/hyper/rusqlite/iroh/... deps) live in
# forge now; flux keeps only what the marshalling layer names directly.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
hyper = { version = "1", features = ["server", "http1"] }
http-body-util = "0.1"
bytes = "1"
fastwebsockets = { version = "0.10.0", features = ["upgrade", "unstable-split"] }
iroh = "1"
# ReaderStream adapts a child's stdout/stderr (AsyncRead) into a byte stream for
# flux:subprocess streaming spawn.
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
libc = "0.2"
