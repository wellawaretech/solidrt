[workspace]
members = [
  "alloy",
  "forge",
  "flux",
  "lattice",
]
resolver = "2"

# Every dependency requirement in this workspace is an exact `=x.y.z` pin, here
# and in the member manifests. Cargo.lock alone does not hold a version still:
# `cargo update` floats a caret requirement to any semver-compatible release, so
# the manifest is where a version is actually decided. Exact pins make each bump
# an explicit, reviewable edit (that is also what dependabot then rewrites).
[workspace.dependencies]
alloy = { path = "alloy" }
forge = { path = "forge" }
flux = { path = "flux", default-features = false }
log = "=0.4.34"
rquickjs = { version = "=0.14.0", features = ["bindgen", "rust-alloc", "futures", "macro", "loader"] }
tokio = { version = "=1.53.1", features = ["rt", "rt-multi-thread", "time", "sync", "net"] }

# livekit-wakeword 0.1.3 + a session optimization-level fix (without it the
# ort-tract backend runs unoptimized graphs, ~9x slower than real time).
# Fork branch fix/wakeword-session-optimization-level; remove when upstream
# ships the fix.
[patch.crates-io]
livekit-wakeword = { git = "https://github.com/antoinevanwel/rust-sdks", rev = "20f6ca2c1b5ce87ebb208f639beadcdf34afc464" }

# QuickJS compiled optimized in the dev profile too, the Rust above it at
# the profile's own level. Unoptimized, the engine runs JS 5x slower on
# Linux and 15x under MSVC (the tiles property test of packages/2d: 1.9 s
# on release, 10.6 s on a Linux debug build, over 30 s on a Windows one,
# 1.96 s on a debug build with this override), and nothing debugs into the
# engine's C; the debug assertions that a debug build is for are the
# Rust's.
[profile.dev.package.rquickjs-sys]
opt-level = 3

[profile.release]

# Build scripts and proc-macros stay unstripped. With Xcode 27 the strip that
# cargo's release default (strip = "debuginfo") runs on a proc-macro dylib
# leaves rustc unable to load it, and its dependents fail with E0463 "can't
# find crate for `futures_macro`". The shipped binaries are not build-time
# crates, so they are stripped as before. release-opt inherits this.
[profile.release.build-override]
strip = "none"

[profile.release-opt]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
