[workspace]
members = [
  "alloy",
  "flux", 
  "lattice",
]
resolver = "2"

[workspace.dependencies]
alloy = { path = "alloy" }
flux = { path = "flux", default-features = false }
log = "0.4"
rquickjs = { version = "0.12.0", features = ["bindgen", "rust-alloc", "futures", "macro", "loader"] }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "time", "sync", "net"] }

# Vendored with a session optimization-level fix (see vendor/.../README.md);
# remove once upstream releases it.
[patch.crates-io]
livekit-wakeword = { path = "vendor/livekit-wakeword" }

[profile.release]

[profile.release-opt]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
