name: Android system dependencies
description: >
  apt-get install the host build tools needed to cross-compile the Android
  APK with cargo-ndk, with retries. The Android targets link against the NDK's
  bionic libc, so the long SDL/X11 host list is not needed here.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        for i in 1 2 3; do
          sudo apt-get update && sudo apt-get install -y \
            libclang-dev clang \
            build-essential git make pkg-config cmake ninja-build \
            && exit 0
          echo "apt-get failed (attempt $i), retrying in 15s"; sleep 15
        done
        exit 1