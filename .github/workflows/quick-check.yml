name: Quick Check

# On-demand debug build of any/all platforms, to validate a change before
# tagging a release. Mirrors the release build jobs but PROFILE=debug and with
# a speech toggle.
on:
  workflow_dispatch:
    inputs:
      speech:
        description: 'Include speech stack (Whisper + wake word)'
        type: choice
        options:
          - '0'
          - '1'
        default: '0'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-22.04
            target: dist-linux
            timeout: 60
          - platform: darwin
            runner: macos-14
            target: dist-darwin
            timeout: 60
          - platform: android
            runner: ubuntu-24.04
            target: dist-android
            timeout: 90
          - platform: windows
            runner: windows-latest
            target: dist-windows
            timeout: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: ${{ matrix.runner }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - if: matrix.platform == 'windows'
        name: Add MSYS2 tools to PATH
        run: echo "C:/msys64/usr/bin" >> $GITHUB_PATH

      - if: matrix.platform == 'linux'
        uses: ./.github/actions/linux-system-deps

      - if: matrix.platform == 'android'
        uses: ./.github/actions/android-system-deps

      - if: matrix.platform == 'android'
        uses: ./.github/actions/cargo-install
        with:
          args: cargo-ndk --locked

      - uses: ./.github/actions/js-install
        with:
          frozen: 'false'

      - name: Build
        run: NDK_HOME="$ANDROID_NDK_ROOT" make ${{ matrix.target }} VERSION=0.0.0-check PROFILE=debug SPEECH=${{ inputs.speech }}