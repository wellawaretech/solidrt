name: Quick Check

# On-demand debug build of the solidrt-go client on any/all platforms, to
# validate a change before tagging a release. The client links everything
# (including flux), so one binary per platform covers the whole build.
# Speech-free, like all release builds.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-22.04
            target: client
            timeout: 60
          - platform: linux-arm
            runner: ubuntu-22.04-arm
            target: client
            timeout: 60
          - platform: darwin
            runner: macos-14
            target: client
            timeout: 60
          - platform: android
            runner: ubuntu-24.04
            target: android-client
            timeout: 90
          - platform: windows
            runner: windows-latest
            target: client
            timeout: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          key: ${{ matrix.runner }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - if: matrix.platform == 'windows'
        name: Add MSYS2 tools to PATH
        run: echo "C:/msys64/usr/bin" >> $GITHUB_PATH

      - if: startsWith(matrix.platform, 'linux')
        uses: ./.github/actions/linux-system-deps

      - if: matrix.platform == 'android'
        uses: ./.github/actions/android-system-deps

      - if: matrix.platform == 'android'
        uses: ./.github/actions/cargo-install
        with:
          args: cargo-ndk --locked

      - uses: ./.github/actions/js-install
        with:
          frozen: 'false'

      - name: Build
        run: NDK_HOME="$ANDROID_NDK_ROOT" make ${{ matrix.target }} VERSION=0.0.0-check PROFILE=debug SPEECH=0