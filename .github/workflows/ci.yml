name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Called by the release workflow as its gate, so a tag publishes only what
  # main's own checks would have passed. Tag pushes match no trigger above
  # (the branches filter never matches a tag ref), so without this a release
  # would run no checks at all.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The vendored codecs behind the video feature (forge/vendor/libvpx,
        # opus); nasm for libvpx comes with linux-system-deps.
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1

      - uses: ./.github/actions/linux-system-deps

      # --all-targets so tests, examples and bins compile too: without it a
      # broken test or probe example passes CI untouched. Video is not a
      # cargo default (see lattice/Makefile) but every shipped build carries
      # it, so the feature rides along here and in the two test steps: flux's
      # gui video plugin and lattice's passthrough compile nowhere else.
      - name: Check
        run: cargo check --workspace --all-targets --features flux/video,lattice/video

      # The Linux-only suites: alloy (hit testing, routing, layout cache, GPU
      # graph propagation), flux with the gui feature (unified in through
      # lattice; its property tests exist only here) and lattice. forge is
      # excluded because test-forge below runs it on every platform, this one
      # included; flux stays because its headless half is what test-flux runs
      # elsewhere and the gui half has no other home.
      - name: Test
        run: cargo test --workspace --exclude forge --features flux/video,lattice/video

      # `go` is not a default feature, so the step above compiles none of the
      # client-only code - including lattice's app-store and dev-server-tunnel
      # tests. That is the code that actually ships (as go + video), so test
      # it explicitly.
      - name: Test go client
        run: cargo test -p lattice --features go,video

  # The engine-free cores, one job, the same command on every platform we
  # ship to (Linux x64 included, so forge is tested exactly once per
  # platform and never through `check`). Anything OS-specific in forge
  # (sockets, fs, subprocess, sqlite) was otherwise never exercised before a
  # release: the first Windows run caught three - a probe budget that passes
  # on Linux but reads a refused connect as "filtered" there (Windows retries
  # the SYN for ~2 s first, okf/notes/port-probe-platform-facts.md), a
  # realpath test expecting the verbatim prefix, and the cache's LRU touch
  # failing on a read-only handle. With the video feature, so the vendored
  # libvpx and opus build and decode on every platform (the x64 runners
  # need nasm for libvpx's SIMD code; the arm ones do not); that is the
  # only system package forge needs.
  test-forge:
    name: test-forge (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: linux-arm
            runner: ubuntu-22.04-arm
          - platform: darwin
            runner: macos-14
          - platform: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          key: test-forge-${{ matrix.platform }}

      - name: Install nasm
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y nasm

      - if: matrix.platform == 'windows'
        uses: ./.github/actions/windows-msys2-tools

      # One test at a time: the worker tests measure real sleeps against the
      # clock, and on a shared 3-core macOS runner 132 parallel tests made
      # the worker wake 58 ms late. The whole suite takes ~9 s serially.
      - name: Test forge
        run: cargo test -p forge --features video -- --test-threads=1

  # The headless flux runtime (QuickJS + the forge marshalling: value, time,
  # marshal, intrinsics) on the same four platforms, same principle as
  # test-forge. `--lib` without gui: the gui half needs alloy (SDL, Impeller)
  # and lives in `check` on Linux. The `test` feature adds flux:test, which
  # the `flux` binary carries, and its tests. QuickJS builds through bindgen,
  # so libclang must be present: the macOS and Windows images ship it (the
  # client builds there with no setup), the Ubuntu images need the package.
  test-flux:
    name: test-flux (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: linux-arm
            runner: ubuntu-22.04-arm
          - platform: darwin
            runner: macos-14
          - platform: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          key: test-flux-${{ matrix.platform }}

      - name: Install libclang
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev clang

      - name: Test flux
        run: cargo test -p flux --lib --features test

  # The flux tests (`tests/*.test.ts` of the packages that import only
  # headless modules, and the flux module tests in `flux/tests/`), run by
  # `sol test --only flux` on a `flux` binary built here, on the same four
  # platforms: the suite runs on the runtime the code ships on, so it is
  # tested wherever that runtime is. A job of its own,
  # not a step of test-flux, so a red job names one suite; the app tests
  # need the dev client and run in test-app below. The binary is a debug
  # build (the suite is functional verification) and without ktx2, whose
  # C++ encoder the tests do not use. The make target stages it under
  # dist/, where SOLIDRT_HOME makes `sol` look. SOLIDRT_HOME is set on the test
  # step only: the Makefile derives its own, and a Windows path from the
  # environment would not survive its include.
  test-js:
    name: test-js (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: linux-arm
            runner: ubuntu-22.04-arm
          - platform: darwin
            runner: macos-14
          - platform: windows
            runner: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: test-js-${{ matrix.platform }}

      - name: Install libclang
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev clang

      # For make; the image's own is not on PATH.
      - if: matrix.platform == 'windows'
        uses: ./.github/actions/windows-msys2-tools

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: ./.github/actions/js-install

      - name: Build flux
        run: make -C flux flux PROFILE=debug KTX2=0

      - name: Test JS
        env:
          SOLIDRT_HOME: ${{ github.workspace }}
        run: bun packages/cli/src/main.ts test --only flux

  # The app tests (`tests/*.test.tsx`, and every file that imports the app
  # runtime), run by `sol test --only app` on the dev client built here, in
  # its headless test mode: Linux only, where the client builds in the same
  # job and SDL's offscreen driver gives the GLES context over Mesa. Same
  # recipe as the release build of the client (system deps, bun for the
  # player bundle, the retried dependency fetch), in the debug profile and
  # without ktx2 like test-js.
  test-app:
    name: test-app (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        # The vendored codecs behind the video feature, which the client
        # carries.
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: test-app-linux

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: ./.github/actions/linux-system-deps

      - uses: ./.github/actions/js-install

      - uses: ./.github/actions/cargo-fetch

      - name: Build client
        run: make client PROFILE=debug KTX2=0

      - name: Test apps
        env:
          SOLIDRT_HOME: ${{ github.workspace }}
        run: bun packages/cli/src/main.ts test --only app

  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: ./.github/actions/js-install

      # Every package and app with a tsconfig.json is typechecked. The list is
      # read from the tree, not kept here: a hand-kept list misses the next
      # package. A package with TypeScript sources but no tsconfig.json fails
      # the step for the same reason (the binary packages have neither); the
      # one nested program, the cli's flux dev server, is named explicitly.
      - name: Typecheck packages
        run: |
          status=0
          for dir in packages/*/; do
            dir="${dir%/}"
            if [ ! -f "$dir/tsconfig.json" ] && find "$dir/src" -type f \( -name '*.ts' -o -name '*.tsx' \) 2>/dev/null | grep -q .; then
              echo "::error::$dir has TypeScript sources but no tsconfig.json"
              status=1
            fi
          done
          for config in packages/*/tsconfig.json apps/*/tsconfig.json packages/cli/src/server/tsconfig.json; do
            echo "== $config"
            node_modules/.bin/tsc -p "$config" --noEmit --pretty false || status=1
          done
          exit $status

      # Every example app must bundle and typecheck: examples are consumed by
      # the documentation generator, so a broken example is a broken docs page.
      - name: Check examples
        run: bun packages/cli/src/main.ts check

      # In a real install the bundler hands a package's plain .ts under
      # node_modules to bun's own loader; in this repo the workspace symlinks
      # resolve to packages/*, so everything above goes through babel and tsc,
      # which both accept what bun's parser rejects (a call to a function
      # named `declare`, say). This is the only check that parses shipped
      # sources the way a user's bundle does.
      - name: Parse shipped sources with bun
        run: |
          status=0
          for f in $(find packages/*/src -name "*.ts" -not -name "*.d.ts"); do
            bun build --no-bundle "$f" --outfile /dev/null > /dev/null 2>&1 || { echo "bun cannot parse $f"; status=1; }
          done
          exit $status

  # okf/index.md is generated, so it is a lie the moment a note is added or
  # moved by hand. This fails the build instead: stale index, missing
  # title/description/created, or a status field outside upstream/ (state is
  # the directory - see okf/README.md). No dependencies, so no js-install.
  okf:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Check okf index
        run: bun scripts/build-okf-index.ts --check

      - name: Check components docs
        run: bun scripts/build-components-docs.ts --check
