name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # The Rust check/test stays PR-only; pushes to main run only the cheap
    # bun-based types job below.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - uses: ./.github/actions/linux-system-deps

      - name: Check
        run: cargo check --workspace

      - name: Test
        run: cargo test -p lattice -p flux

  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: ./.github/actions/js-install

      - name: Typecheck packages
        run: |
          for config in packages/core packages/components packages/cli packages/cli/server lattice/launcher; do
            echo "== $config"
            node_modules/.bin/tsc -p "$config/tsconfig.json" --noEmit --pretty false
          done

      # Every example app must bundle and typecheck: examples are consumed by
      # the documentation generator, so a broken example is a broken docs page.
      - name: Check examples
        run: |
          for app in examples/*/; do
            echo "== $app"
            bun packages/cli/src/main.ts check "$app"src/index.tsx
          done
