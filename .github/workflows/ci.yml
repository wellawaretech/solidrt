name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Called by the release workflow as its gate, so a tag publishes only what
  # main's own checks would have passed. Tag pushes match no trigger above
  # (the branches filter never matches a tag ref), so without this a release
  # would run no checks at all.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1

      - uses: ./.github/actions/linux-system-deps

      # --all-targets so tests, examples and bins compile too: without it a
      # broken test or probe example passes CI untouched.
      - name: Check
        run: cargo check --workspace --all-targets

      # The Linux-only suites: alloy (hit testing, routing, layout cache, GPU
      # graph propagation), flux with the gui feature (unified in through
      # lattice; its property tests exist only here) and lattice. forge is
      # excluded because test-forge below runs it on every platform, this one
      # included; flux stays because its headless half is what test-flux runs
      # elsewhere and the gui half has no other home.
      - name: Test
        run: cargo test --workspace --exclude forge

      # `go` is not a default feature, so the step above compiles none of the
      # client-only code - including lattice's app-store and dev-server-tunnel
      # tests. That is the code that actually ships, so test it explicitly.
      - name: Test go client
        run: cargo test -p lattice --features go

  # The engine-free cores, one job, the same command on every platform we
  # ship to (Linux x64 included, so forge is tested exactly once per
  # platform and never through `check`). Anything OS-specific in forge
  # (sockets, fs, subprocess, sqlite) was otherwise never exercised before a
  # release: the first Windows run caught three - a probe budget that passes
  # on Linux but reads a refused connect as "filtered" there (Windows retries
  # the SYN for ~2 s first, okf/notes/port-probe-platform-facts.md), a
  # realpath test expecting the verbatim prefix, and the cache's LRU touch
  # failing on a read-only handle. forge needs no system packages, so the
  # job is toolchain + cache + test.
  test-forge:
    name: test-forge (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: linux-arm
            runner: ubuntu-22.04-arm
          - platform: darwin
            runner: macos-14
          - platform: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          key: test-forge-${{ matrix.platform }}

      - name: Test forge
        run: cargo test -p forge

  # The headless flux runtime (QuickJS + the forge marshalling: value, time,
  # marshal, intrinsics) on the same four platforms, same principle as
  # test-forge. `--lib` with default features: the gui half needs alloy (SDL,
  # Impeller) and lives in `check` on Linux. QuickJS builds through bindgen,
  # so libclang must be present: the macOS and Windows images ship it (the
  # client builds there with no setup), the Ubuntu images need the package.
  test-flux:
    name: test-flux (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: linux-arm
            runner: ubuntu-22.04-arm
          - platform: darwin
            runner: macos-14
          - platform: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          key: test-flux-${{ matrix.platform }}

      - name: Install libclang
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev clang

      - name: Test flux
        run: cargo test -p flux --lib

  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: ./.github/actions/js-install

      - name: Typecheck packages
        run: |
          for config in packages/core packages/components packages/2d packages/3d packages/cli packages/cli/src/server apps/player; do
            echo "== $config"
            node_modules/.bin/tsc -p "$config/tsconfig.json" --noEmit --pretty false
          done

      # Every example app must bundle and typecheck: examples are consumed by
      # the documentation generator, so a broken example is a broken docs page.
      - name: Check examples
        run: bun packages/cli/src/main.ts check

      # In a real install the bundler hands a package's plain .ts under
      # node_modules to bun's own loader; in this repo the workspace symlinks
      # resolve to packages/*, so everything above goes through babel and tsc,
      # which both accept what bun's parser rejects (a call to a function
      # named `declare`, say). This is the only check that parses shipped
      # sources the way a user's bundle does.
      - name: Parse shipped sources with bun
        run: |
          status=0
          for f in $(find packages/*/src -name "*.ts" -not -name "*.d.ts"); do
            bun build --no-bundle "$f" --outfile /dev/null > /dev/null 2>&1 || { echo "bun cannot parse $f"; status=1; }
          done
          exit $status

  # okf/index.md is generated, so it is a lie the moment a note is added or
  # moved by hand. This fails the build instead: stale index, missing
  # title/description/created, or a status field outside upstream/ (state is
  # the directory - see okf/README.md). No dependencies, so no js-install.
  okf:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Check okf index
        run: bun scripts/build-okf-index.ts --check

      - name: Check components docs
        run: bun scripts/build-components-docs.ts --check
