name: Release

# One run per release, started by hand with the version to publish:
#   Actions -> Release -> Run workflow -> version: 0.0.78 (or 0.0.78-rc.1)
#
# `prepare` refuses a malformed or already-released version and a commit CI
# has not passed (CI is required, not rerun). The five platform builds run
# once, at the publish profile, with that version stamped in. `pack` makes
# every npm tarball and checks it, with no registry token in reach. `publish`
# waits for the approval the `release` environment requires (a required
# reviewer, set in the repository settings), publishes the tarballs in
# dependency order and pushes the tag. Declining the approval is the dry
# run: nothing public exists before it, so a failed or rejected build leaves
# no tag and no version behind, and the tag marks a published release.
#
# A prerelease suffix (-rc.1, -beta.2) publishes under that dist-tag and
# leaves `latest` alone. A publish that failed partway is finished by
# re-running this run's failed jobs (publish-if-new.sh skips what landed),
# not by a new dispatch, which `prepare` refuses once a package is on the
# registry.
#
# Every build here passes PROFILE=release-opt, the publish profile (fat LTO,
# one codegen unit, stripped) for all the binaries; a plain `make dist` builds
# them at release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release: X.Y.Z, or X.Y.Z-rc.1 for a prerelease'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Single source of truth for which packages get version-bumped and
  # published, in publish order: a package after the ones it depends on.
  PUBLISH_DIRS: >-
    packages/core packages/components packages/2d packages/3d packages/router packages/test packages/flux-types
    packages/darwin-arm64 packages/linux-x64-gnu packages/linux-arm64-gnu
    packages/win32-x64-msvc
    packages/android-arm64-v8a packages/android-armeabi-v7a packages/android-x86_64
    packages/cli packages/create-solidrt packages/solidrt

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # For the CI run lookup.
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_flag: ${{ steps.version.outputs.tag_flag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version is the one input; everything downstream reads it from
      # here. The dist-tag is derived from the prerelease identifier:
      # 0.0.1-exp.1 -> exp, 1.0.0-beta.3 -> beta, 1.0.0-rc.1 -> rc.
      - name: Check the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Version must be X.Y.Z or X.Y.Z-<prerelease>, got: $VERSION"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION exists already"
            exit 1
          fi
          released=0
          for dir in ${PUBLISH_DIRS}; do
            name=$(jq -r .name "$dir/package.json")
            status=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${name//\//%2f}/${VERSION}")
            if [ "$status" = "200" ]; then
              echo "::error::${name}@${VERSION} is on the registry already"
              released=1
            fi
          done
          [ "$released" -eq 0 ]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            TAG="${VERSION#*-}"
            TAG="${TAG%%.*}"
            echo "tag_flag=--tag $TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag_flag=" >> "$GITHUB_OUTPUT"
          fi

      # The release gate is CI's verdict on this exact commit, looked up
      # rather than recomputed: a rerun of the suite proves nothing a green
      # run did not, and costs a second roll of the flake dice (a dry run
      # once failed on an app test that had passed on the same commit
      # minutes before). No green run means wait for CI, or push a commit
      # that passes.
      - name: Check CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --workflow ci.yml --json status,conclusion,url)
          if [ "$(jq -r '[.[] | select(.conclusion == "success")] | length' <<< "$runs")" != "0" ]; then
            echo "CI passed on $GITHUB_SHA"
            exit 0
          fi
          running=$(jq -r '.[] | select(.status != "completed") | .url' <<< "$runs" | head -n 1)
          failed=$(jq -r '.[] | select(.status == "completed") | .url' <<< "$runs" | head -n 1)
          if [ -n "$running" ]; then
            echo "::error::CI is still running on $GITHUB_SHA: wait for it, then dispatch again ($running)"
          elif [ -n "$failed" ]; then
            echo "::error::CI did not pass on $GITHUB_SHA ($failed)"
          else
            echo "::error::No CI run on $GITHUB_SHA: push it to main first"
          fi
          exit 1

  build-linux:
    needs: prepare
    # Build on the oldest supported runner so the binary's glibc baseline stays
    # low enough to run on older distros. ubuntu-22.04 ships glibc 2.35 (Ubuntu
    # 22.04+, Debian 12+). Building on a newer image (e.g. 24.04 = 2.39) raises
    # the baseline and breaks on older targets.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The vendored codecs (forge/vendor/libvpx, opus) that every build
        # carries since video became the default.
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          key: ubuntu-22.04

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: ./.github/actions/linux-system-deps

      - uses: ./.github/actions/js-install

      # Every dependency comes down here before the build: the download is
      # the one network step that has failed release builds. Its own step,
      # retried, so a failure is a minute and a rerun of this job.
      - uses: ./.github/actions/cargo-fetch

      - name: Build
        run: make dist PROFILE=release-opt VERSION="$VERSION"

      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x64-gnu
          path: |
            packages/linux-x64-gnu/solidrt-go
            packages/linux-x64-gnu/solidrt
            packages/linux-x64-gnu/flux
            packages/linux-x64-gnu/fluxc
            packages/linux-x64-gnu/fluxrt
            packages/linux-x64-gnu/THIRD-PARTY-NOTICES.txt

  # Same recipe as build-linux on GitHub's arm64 runner: the Linux build is
  # host-native, so the arm64 runner produces aarch64 binaries (Raspberry Pi
  # 4/5 on a 64-bit OS, arm64 servers). ubuntu-22.04-arm keeps the same glibc
  # 2.35 baseline (Raspberry Pi OS Bookworm ships 2.36).
  build-linux-arm:
    needs: prepare
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The vendored codecs (forge/vendor/libvpx, opus) that every build
        # carries since video became the default.
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          key: ubuntu-22.04-arm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: ./.github/actions/linux-system-deps

      - uses: ./.github/actions/js-install

      # The retried dependency fetch, see build-linux.
      - uses: ./.github/actions/cargo-fetch

      - name: Build
        run: make dist PROFILE=release-opt VERSION="$VERSION"

      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-arm64-gnu
          path: |
            packages/linux-arm64-gnu/solidrt-go
            packages/linux-arm64-gnu/solidrt
            packages/linux-arm64-gnu/flux
            packages/linux-arm64-gnu/fluxc
            packages/linux-arm64-gnu/fluxrt
            packages/linux-arm64-gnu/THIRD-PARTY-NOTICES.txt

  build-darwin:
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The vendored codecs (forge/vendor/libvpx, opus) that every build
        # carries since video became the default.
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          key: macos-14

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: ./.github/actions/js-install

      # The retried dependency fetch, see build-linux.
      - uses: ./.github/actions/cargo-fetch

      - name: Build
        run: make dist PROFILE=release-opt VERSION="$VERSION"

      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin-arm64
          path: |
            packages/darwin-arm64/solidrt-go
            packages/darwin-arm64/solidrt
            packages/darwin-arm64/flux
            packages/darwin-arm64/fluxc
            packages/darwin-arm64/fluxrt
            packages/darwin-arm64/libEGL.dylib
            packages/darwin-arm64/libGLESv2.dylib
            packages/darwin-arm64/THIRD-PARTY-NOTICES.txt

  build-android:
    needs: prepare
    # The runner image version is deliberately independent of build-linux here.
    # This job cross-compiles with cargo-ndk to *-linux-android targets, which
    # link against the NDK's bionic libc, not the host glibc. The resulting .apk
    # has no host-glibc dependency (its floor is the NDK minSdkVersion), so the
    # oldest-runner rule that applies to build-linux is irrelevant. A newer image
    # is preferred here because it ships a newer preinstalled NDK.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The vendored codecs (forge/vendor/libvpx, opus) that every build
        # carries since video became the default.
        with:
          submodules: true

      # Toolchain channel and the Android targets to install come from
      # rust-toolchain.toml (the single source of truth rustup actually obeys
      # inside the repo). Listing targets here would only add them to a different
      # toolchain that the pinned build never uses.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          # Suffix bumped to force a one-time fresh cache: a 4 KB-aligned
          # libSDL3.so cached under the old key would otherwise get repackaged,
          # since a change to the cmake toolchain file does not rerun the
          # sdl3-sys build script. Bump again whenever a stale cmake .so needs
          # purging.
          key: ubuntu-24.04-align16k-2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: ./.github/actions/cargo-install
        with:
          args: cargo-ndk --locked

      - uses: ./.github/actions/android-system-deps

      - uses: ./.github/actions/js-install

      # Each dist goal builds both APKs for its ABI: the client
      # (solidrt-go.apk) and the production runner `sol pack --apk` patches
      # (solidrt.apk). Both are per-ABI by decision, no fat APK
      # (okf/backlog/standalone-android-apk.md). The Makefile stages them
      # into packages/android-<abi>/ itself.
      # The retried dependency fetch, see build-linux.
      - uses: ./.github/actions/cargo-fetch

      # The Player's signing key (lattice/android/app/build.gradle): a base64
      # PKCS12 keystore secret, decoded to a temp file whose path the build
      # steps inherit. The password reaches only those steps. Without the
      # secret the release stops here: the Player it would publish could not
      # update the ones installed from npm.
      - name: Decode Player signing key
        env:
          PLAYER_KEYSTORE: ${{ secrets.ANDROID_PLAYER_KEYSTORE }}
        run: |
          if [ -z "$PLAYER_KEYSTORE" ]; then
            echo "::error::The ANDROID_PLAYER_KEYSTORE secret is not set"
            exit 1
          fi
          echo "$PLAYER_KEYSTORE" | base64 -d > "$RUNNER_TEMP/player.p12"
          echo "SOLIDRT_PLAYER_KEYSTORE=$RUNNER_TEMP/player.p12" >> "$GITHUB_ENV"

      - name: Build APKs (arm64-v8a)
        env:
          SOLIDRT_PLAYER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PLAYER_KEYSTORE_PASSWORD }}
        run: NDK_HOME="$ANDROID_NDK_ROOT" make android-dist PROFILE=release-opt VERSION="$VERSION" PUBLISH=1

      - name: Build APKs (armeabi-v7a)
        env:
          SOLIDRT_PLAYER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PLAYER_KEYSTORE_PASSWORD }}
        run: NDK_HOME="$ANDROID_NDK_ROOT" make android-dist-armeabi-v7a PROFILE=release-opt VERSION="$VERSION" PUBLISH=1

      # x86_64 is the emulator and Intel/AMD Chromebook ABI. No physical phone
      # ships it, but without it neither can run a SolidRT app from npm.
      - name: Build APKs (x86_64)
        env:
          SOLIDRT_PLAYER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PLAYER_KEYSTORE_PASSWORD }}
        run: NDK_HOME="$ANDROID_NDK_ROOT" make android-dist ANDROID_ABI=x86_64 PROFILE=release-opt VERSION="$VERSION" PUBLISH=1

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-arm64-v8a
          path: |
            packages/android-arm64-v8a/solidrt-go.apk
            packages/android-arm64-v8a/solidrt.apk
            packages/android-arm64-v8a/THIRD-PARTY-NOTICES.txt

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-armeabi-v7a
          path: |
            packages/android-armeabi-v7a/solidrt-go.apk
            packages/android-armeabi-v7a/solidrt.apk
            packages/android-armeabi-v7a/THIRD-PARTY-NOTICES.txt

      - name: Upload x86_64 APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-x86_64
          path: |
            packages/android-x86_64/solidrt-go.apk
            packages/android-x86_64/solidrt.apk
            packages/android-x86_64/THIRD-PARTY-NOTICES.txt

  build-windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The vendored codecs (forge/vendor/libvpx, opus) that every build
        # carries since video became the default.
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          key: windows-latest

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: ./.github/actions/windows-msys2-tools

      - uses: ./.github/actions/js-install

      # The retried dependency fetch, see build-linux.
      - uses: ./.github/actions/cargo-fetch

      - name: Build
        run: make dist PROFILE=release-opt VERSION="$VERSION"

      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win32-x64-msvc
          path: |
            packages/win32-x64-msvc/solidrt-go.exe
            packages/win32-x64-msvc/solidrt.exe
            packages/win32-x64-msvc/flux.exe
            packages/win32-x64-msvc/fluxc.exe
            packages/win32-x64-msvc/fluxrt.exe
            packages/win32-x64-msvc/libEGL.dll
            packages/win32-x64-msvc/libGLESv2.dll
            packages/win32-x64-msvc/THIRD-PARTY-NOTICES.txt

  # The npm tarballs: versions bumped, binaries in place, the CLI's bundles
  # built, intra-monorepo specifiers pinned, every package packed and
  # checked. This job runs `bun install` and the CLI's own build and holds
  # no registry token: a package anywhere in the dependency graph runs here
  # with nothing to steal. The tarballs go to `publish` as an artifact.
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [prepare, build-linux, build-linux-arm, build-darwin, build-windows, build-android]
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Bump package versions
        run: |
          missing=0
          for dir in packages/*/; do
            dir="${dir%/}"
            if [[ ! " ${PUBLISH_DIRS} " =~ " ${dir} " ]]; then
              echo "::error::Package directory '${dir}' is not in PUBLISH_DIRS"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          for dir in ${PUBLISH_DIRS}; do
            (cd "$dir" && npm pkg set version="$VERSION")
          done

      # Reconcile the lockfile with the versions bumped above. Plain `bun install`
      # (not `bun update`) so only the bumped workspace packages change and
      # unrelated dependencies are not silently upgraded mid-release.
      - name: Refresh lockfile with bumped versions
        uses: ./.github/actions/js-install
        with:
          frozen: 'false'

      # Pull every build artifact into its package dir in one shot: each artifact
      # is named after its package (linux-x64-gnu, darwin-arm64, ...) so it lands
      # in packages/<name>/.
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages

      - name: Restore executable bit on binaries
        run: |
          for d in linux-x64-gnu linux-arm64-gnu darwin-arm64; do
            chmod +x packages/$d/solidrt-go packages/$d/solidrt \
              packages/$d/flux packages/$d/fluxc packages/$d/fluxrt
          done

      # The CLI package ships the dev server as one prebuilt bundle
      # (dist/server.js, see packages/cli/Makefile), so an installed sol
      # runs it on the platform package's flux without bundling per launch.
      - name: Build the CLI dev server bundle
        run: make -C packages/cli dist/server.js

      # The CLI package also ships the player and BSOD bundles (player/): the
      # two screens every runtime embeds (docs/runtime, "A custom runtime"),
      # made here by this release's CLI from this release's apps/player so they
      # match the lattice tag of the same version. The bundle goal writes them
      # into the package directly.
      - name: Bundle the player into the CLI package
        run: make -C lattice player-bundle

      # The CLI package also ships the dev console pre-compiled
      # (dist/console.solapp, see packages/cli/Makefile): `sol pack --app`
      # needs the platform fluxc, so it runs after it.
      # The package demos ride along pre-bundled (dist/demos/, `sol demo`).
      - name: Build the console app pack and the demos
        run: make -C packages/cli dist/console.solapp demos

      # Pin every intra-monorepo (@solidrt/*) dependency specifier to the release
      # version before packing. Source uses `workspace:*`; `bun publish` would
      # otherwise resolve those from bun.lock, but a plain `bun install` does not
      # reliably refresh the workspace members' recorded versions after the bump
      # above, so the stale 0.0.0 placeholder gets baked into the tarball -- this
      # shipped broken 0.0.14/0.0.16, whose @solidrt/* optionalDependencies
      # pointed at an unpublished 0.0.0 and silently failed to install the native
      # binaries. Rewriting the specifiers here makes them deterministic WITHOUT
      # touching bun.lock, so external dependencies stay pinned (no re-resolution,
      # no supply-chain drift). Runs after `bun install` above, so `workspace:*`
      # still resolves locally during install.
      #
      # The cli scaffold/package.json is the template copied into a freshly
      # created app; it ships inside the @solidrt/cli tarball and carries the
      # 0.0.0 placeholder in source. Pin it here too so a scaffolded project
      # installs the exact @solidrt/* version the CLI was published with (and so
      # prereleases, which do not get the `latest` dist-tag, scaffold a matching
      # version). The scaffold also pins solid-js and its two @solidjs peers,
      # so an app upgrades them by editing package.json (bun neither follows a
      # moved peer pin nor re-resolves one, packages/core/AGENTS.md); those
      # pins are taken from core's peerDependencies, the one place the Solid
      # version is decided.
      - name: Pin intra-monorepo dependency versions
        run: |
          node -e '
            const fs = require("fs");
            const VERSION = process.env.VERSION;
            const files = process.env.PUBLISH_DIRS.trim().split(/\s+/).map(d => d + "/package.json");
            const scaffold = "packages/cli/src/init/scaffold/package.json";
            files.push(scaffold);
            const solidPeers = JSON.parse(fs.readFileSync("packages/core/package.json", "utf8")).peerDependencies;
            for (const file of files) {
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              if (file === scaffold) {
                for (const name of ["solid-js", "@solidjs/signals", "@solidjs/universal"]) {
                  if (!solidPeers[name]) throw new Error(`packages/core/package.json names no peer ${name}`);
                  pkg.dependencies[name] = solidPeers[name];
                }
              }
              for (const field of ["dependencies", "optionalDependencies", "peerDependencies", "devDependencies"]) {
                const deps = pkg[field];
                if (!deps) continue;
                for (const name of Object.keys(deps)) {
                  if (name.startsWith("@solidrt/")) deps[name] = VERSION;
                }
              }
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
            }
          '

      # Pack every package, one directory per package (tarballs/<dir name>/)
      # so `publish` finds them in PUBLISH_DIRS order, and fail the release
      # if any tarball's own version or intra-monorepo @solidrt/* specifier
      # did not end up at the release version -- catches the 0.0.14/0.0.16
      # failure mode before anything reaches the registry. Also inspects the
      # nested scaffold/package.json shipped inside @solidrt/cli: its
      # @solidrt/* devDependencies broke 0.0.19 by staying at 0.0.0.
      - name: Pack and verify the tarballs
        run: |
          set -eu
          TARBALLS="$RUNNER_TEMP/tarballs"
          rm -rf "$TARBALLS" && mkdir -p "$TARBALLS"
          for dir in ${PUBLISH_DIRS}; do
            out="$TARBALLS/$(basename "$dir")"
            mkdir -p "$out"
            ( cd "$dir" && bun pm pack --destination "$out" >/dev/null )
          done
          fail=0
          for tgz in "$TARBALLS"/*/*.tgz; do
            dest="$RUNNER_TEMP/extract/$(basename "$tgz" .tgz)"
            rm -rf "$dest" && mkdir -p "$dest"
            tar -xzf "$tgz" -C "$dest"
            bad=$(node -e '
              const fs = require("fs"), V = process.env.VERSION, root = process.argv[1], b = [];
              for (const rel of ["package/package.json", "package/scaffold/package.json"]) {
                const file = root + "/" + rel;
                if (!fs.existsSync(file)) continue;
                const p = JSON.parse(fs.readFileSync(file, "utf8"));
                if (rel === "package/package.json" && p.version !== V) b.push(rel + " version=" + p.version);
                for (const f of ["dependencies", "optionalDependencies", "peerDependencies", "devDependencies"]) {
                  const d = p[f] || {};
                  for (const [k, v] of Object.entries(d)) if (k.startsWith("@solidrt/") && v !== V) b.push(rel + " " + f + " " + k + "=" + v);
                }
              }
              if (b.length) console.log(b.join(", "));
            ' "$dest")
            if [ -n "$bad" ]; then echo "::error::unresolved version in $(basename "$tgz") -> $bad"; fail=1; fi
          done
          [ "$fail" -eq 0 ]
          ls -l "$TARBALLS"/*

      - name: Upload tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/tarballs
          if-no-files-found: error

  # The irreversible step, behind the `release` environment's approval. Only
  # this job sees the registry token, and it installs nothing: it publishes
  # the tarballs `pack` made, then pushes the tag that marks the commit as
  # released.
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [prepare, pack]
    environment: release
    permissions:
      # For the tag push.
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG_FLAG: ${{ needs.prepare.outputs.tag_flag }}
      NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Download tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/tarballs

      - name: Publish packages
        run: |
          set -eu
          TARBALLS="$RUNNER_TEMP/tarballs"
          for dir in ${PUBLISH_DIRS}; do
            ./.github/scripts/publish-if-new.sh "$TARBALLS/$(basename "$dir")"/*.tgz
          done

      - name: Tag the release
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"
