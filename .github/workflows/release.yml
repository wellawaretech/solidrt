name: Release

on:
  push:
    tags:
      - 'v*'
  # Allows manually triggering the workflow from the Actions tab on GitHub.
  # Use this for dry runs before tagging a real release:
  #   Actions -> Release -> Run workflow -> dry_run: checked (default)
  # To do a real publish via manual trigger, uncheck dry_run.
  # Tag pushes (v*) always publish for real regardless of this input.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build and pack but do not publish)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Single source of truth for whether release builds ship the speech stack
  # (Whisper + wake word). Set to '1' to re-enable. 32-bit Android (armeabi-v7a)
  # is forced speech-free in lattice/Makefile regardless of this value.
  SPEECH: '0'

jobs:
  build-linux:
    # Build on the oldest supported runner so the binary's glibc baseline stays
    # low enough to run on older distros. ubuntu-22.04 ships glibc 2.35 (Ubuntu
    # 22.04+, Debian 12+). Building on a newer image (e.g. 24.04 = 2.39) raises
    # the baseline and breaks on older targets.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: ubuntu-22.04

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: ./.github/actions/linux-system-deps

      - uses: ./.github/actions/js-install

      - name: Build
        run: make dist-linux VERSION="${GITHUB_REF_NAME#v}" SPEECH="${SPEECH}"

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x64-gnu
          path: |
            packages/linux-x64-gnu/solidrt-go
            packages/linux-x64-gnu/solidrt
            packages/linux-x64-gnu/flux
            packages/linux-x64-gnu/fluxc
            packages/linux-x64-gnu/fluxrt

  build-darwin:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: macos-14

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: ./.github/actions/js-install

      - name: Build
        run: make dist-darwin VERSION="${GITHUB_REF_NAME#v}" SPEECH="${SPEECH}"

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-arm64
          path: |
            packages/darwin-arm64/solidrt-go
            packages/darwin-arm64/solidrt
            packages/darwin-arm64/flux
            packages/darwin-arm64/fluxc
            packages/darwin-arm64/fluxrt
            packages/darwin-arm64/libimpeller.dylib
            packages/darwin-arm64/libEGL.dylib
            packages/darwin-arm64/libGLESv2.dylib

  build-android:
    # The runner image version is deliberately independent of build-linux here.
    # This job cross-compiles with cargo-ndk to *-linux-android targets, which
    # link against the NDK's bionic libc, not the host glibc. The resulting .apk
    # has no host-glibc dependency (its floor is the NDK minSdkVersion), so the
    # oldest-runner rule that applies to build-linux is irrelevant. A newer image
    # is preferred here because it ships a newer preinstalled NDK.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Toolchain channel and the Android targets to install come from
      # rust-toolchain.toml (the single source of truth rustup actually obeys
      # inside the repo). Listing targets here would only add them to a different
      # toolchain that the pinned build never uses.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: ubuntu-24.04

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: ./.github/actions/cargo-install
        with:
          args: cargo-ndk --locked

      - uses: ./.github/actions/android-system-deps

      - uses: ./.github/actions/js-install

      - name: Build fat APK (arm64-v8a + x86_64)
        run: NDK_HOME="$ANDROID_NDK_ROOT" make dist-android VERSION="${GITHUB_REF_NAME#v}" SPEECH="${SPEECH}"

      # 32-bit (armeabi-v7a) ships speech-free unconditionally: SPEECH is forced
      # off for 32-bit ABIs in lattice/Makefile, so this omits the flag.
      - name: Build 32-bit APK (armeabi-v7a)
        run: NDK_HOME="$ANDROID_NDK_ROOT" make dist-android-armeabi-v7a VERSION="${GITHUB_REF_NAME#v}"

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-arm64-v8a
          path: packages/android-arm64-v8a/solidrt-go.apk

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-armeabi-v7a
          path: packages/android-armeabi-v7a/solidrt-go.apk

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: windows-latest

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Add MSYS2 tools to PATH
        run: echo "C:/msys64/usr/bin" >> $GITHUB_PATH

      - uses: ./.github/actions/js-install

      - name: Build
        run: make dist-windows VERSION="${GITHUB_REF_NAME#v}" SPEECH="${SPEECH}"

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: win32-x64-msvc
          path: |
            packages/win32-x64-msvc/solidrt-go.exe
            packages/win32-x64-msvc/solidrt.exe
            packages/win32-x64-msvc/flux.exe
            packages/win32-x64-msvc/fluxc.exe
            packages/win32-x64-msvc/fluxrt.exe
            packages/win32-x64-msvc/libEGL.dll
            packages/win32-x64-msvc/libGLESv2.dll

  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [build-linux, build-darwin, build-windows, build-android]
    environment: release
    env:
      NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Single source of truth for which packages get version-bumped and published.
      PUBLISH_DIRS: >-
        packages/core packages/components packages/flux-types
        packages/darwin-arm64 packages/linux-x64-gnu packages/win32-x64-msvc
        packages/android-arm64-v8a packages/android-armeabi-v7a
        packages/cli packages/create-solidrt
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compute version and publish flags
        id: flags
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "${{ inputs.dry_run }}" == "true" ]]; then
            # Dry-run dispatch from a branch: use a placeholder, nothing will be published
            VERSION="0.0.0-dry-run"
          else
            echo "::error::Real publish requires a vX.Y.Z tag, got: ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Derive dist-tag from the prerelease identifier:
          # 0.0.1-exp.1 -> exp, 1.0.0-beta.3 -> beta, 1.0.0-rc.1 -> rc
          if [[ "$VERSION" == *-* ]]; then
            TAG="${VERSION#*-}"
            TAG="${TAG%%.*}"
            echo "tag_flag=--tag $TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag_flag=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Bump package versions
        run: |
          VERSION="${{ steps.flags.outputs.version }}"
          for dir in packages/*/; do
            dir="${dir%/}"
            if [[ ! " ${PUBLISH_DIRS} " =~ " ${dir} " ]]; then
              echo "::warning::Package directory '${dir}' is not in the publish list"
            fi
          done
          for dir in ${PUBLISH_DIRS}; do
            (cd "$dir" && npm pkg set version="$VERSION")
          done

      - name: Bump Rust crate versions
        if: ${{ !inputs.dry_run }}
        uses: ./.github/actions/cargo-install
        with:
          args: cargo-edit --locked --no-default-features --features set-version

      - name: Set Rust crate versions
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION="${{ steps.flags.outputs.version }}"
          for crate in flux alloy lattice; do
            (cd "$crate" && cargo set-version "$VERSION")
          done

      # Reconcile the lockfile with the versions bumped above. Plain `bun install`
      # (not `bun update`) so only the bumped workspace packages change and
      # unrelated dependencies are not silently upgraded mid-release.
      - name: Refresh lockfile with bumped versions
        uses: ./.github/actions/js-install
        with:
          frozen: 'false'

      # Pull every build artifact into its package dir in one shot: each artifact
      # is named after its package (linux-x64-gnu, darwin-arm64, ...) so it lands
      # in packages/<name>/.
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages

      - name: Restore executable bit on binaries
        run: |
          for d in linux-x64-gnu darwin-arm64; do
            chmod +x packages/$d/solidrt-go packages/$d/solidrt \
              packages/$d/flux packages/$d/fluxc packages/$d/fluxrt
          done

      - name: Publish packages
        env:
          VERSION: ${{ steps.flags.outputs.version }}
          TAG_FLAG: ${{ steps.flags.outputs.tag_flag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          for dir in ${PUBLISH_DIRS}; do
            ./.github/scripts/publish-if-new.sh "$dir"
          done