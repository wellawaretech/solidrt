name: Windows Client

on:
  workflow_dispatch:

jobs:
  build-windows-client:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # The Makefile recipes are unix-flavored (make, unzip, sed, bash). Git Bash
      # on the runner already provides sed/curl/bash; make and unzip do not ship
      # by default, so pull them from chocolatey (its shim dir is already on PATH).
      - name: Install build tools
        run: choco install make unzip --yes --no-progress

      - name: Install JS dependencies
        run: bun install

      - name: Build client
        shell: bash
        run: make client PROFILE=debug SPEECH=0 VERSION=0.0.0-check

      - name: Upload client
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: solidrt-go-windows-debug
          path: |
            dist/win32-x64-msvc/solidrt-go.exe
            dist/win32-x64-msvc/libEGL.dll
            dist/win32-x64-msvc/libGLESv2.dll
          if-no-files-found: error