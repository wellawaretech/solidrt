# The stock SolidRT program: lattice with no modules of its own, built as
# the `solidrt` production runtime, the `solidrt-go` dev client and the
# Android cdylib of each (Makefile). A custom runtime (docs/runtime, "A
# custom runtime") is this crate beside an app, with its modules.
[package]
name = "solidrt"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

# The binaries are src/bin/solidrt.rs and src/bin/solidrt-go.rs (cargo finds
# them by name); the dev client is the same program behind the `go` feature.
[[bin]]
name = "solidrt-go"
required-features = ["go"]

# The one feature of the crate's own: the player, for the solidrt-go binary
# to require. The capabilities (video, ktx2, wasm) are lattice's default
# features, which the plain dependency line below takes whole: the stock set.
[features]
go = ["lattice/go"]

[dependencies]
lattice = { path = "../lattice" }
