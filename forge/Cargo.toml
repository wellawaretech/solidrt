[package]
name = "forge"
version = "0.0.0"
edition = "2021"
license = "MIT"

[lib]
name = "forge"
path = "src/lib.rs"

[features]
# forge::audio: the clip decoders to interleaved f32 - WAV (own reader),
# Opus in Ogg (the vendored libopusfile and libogg, forge/vendor/opusfile and
# forge/vendor/ogg) and the Opus decoder itself (the vendored libopus,
# forge/vendor/opus), all built by build.rs. Not a cargo default (a plain
# build needs no submodule); `video` turns it on. See
# okf/plans/audio-unification.md.
audio = []
# forge::video: WebM demux (own reader) plus the video decoder: AMediaCodec
# on Android, the vendored libvpx (forge/vendor/libvpx, built by build.rs)
# everywhere else; the Opus track decodes through `audio`, and the WebM
# audio clip decoder (forge::audio over the WebM reader) comes with this
# feature, the container being video's. Not a cargo default (a plain build
# needs neither the vendor submodules nor nasm); every lattice Makefile
# goal enables it. See okf/backlog/video-playback.md.
video = ["audio", "dep:ndk", "dep:ndk-sys"]
# forge::video::encode (flux:video's `record`): the VP9 encoder (the same
# vendored libvpx with its encoder configured in, 1.28 MB of linked binary;
# AMediaCodec on Android), the Opus encoder (in the vendored libopus already)
# and the WebM writer. Implies `video`: the writer shares the container
# module, and the tests decode what they encode. See
# okf/plans/video-encode.md.
video-encode = ["video"]
# forge::p2p (flux:p2p): direct peer-to-peer connections over iroh, its QUIC
# and TLS stack, and the p2p accept loop of the HTTP server. Not a cargo
# default; lattice's default set and its player turn it on. See
# okf/backlog/module-feature-flags.md.
p2p = ["dep:iroh", "dep:url"]
# forge::p2p::relay (flux:p2p's `serveRelay`): an iroh relay served from this
# process over plain HTTP, the path between peers a direct UDP path does
# not carry; the `server` half of iroh-relay. Independent of `p2p`: the
# relay needs no endpoint, so an app that serves it for others need not be
# a peer itself. Not a cargo default (it pulls the relay's HTTP server
# stack); lattice's default set turns it on. See okf/plans/video-encode.md.
p2p-relay = ["dep:iroh-relay", "dep:iroh-base", "dep:url"]
# forge::ktx2: compressed textures - KTX2 files of Basis Universal texel data
# transcoded to the device's block format (ETC2, BC7), and the encoder that
# bakes them. The vendored Basis Universal (forge/vendor/basis_universal, a
# submodule pinned to a release tag) built by build.rs through cc, reached
# over its C API with hand-written bindings. Encoder and transcoder both
# (splitting them is a size item: okf/backlog/runtime-optimization.md). Not
# a cargo default, like video: a plain build needs no submodule. See
# okf/plans/gpu-compressed-textures.md.
ktx2 = []
# forge::wasm (flux:wasm): wasmi, the pure-Rust interpreter, the lane on every
# target. See okf/design/wasm.md.
wasm = ["dep:wasmi"]
# The native lane on top of it: wasmtime with Cranelift compiles a module to
# machine code for the host (okf/design/wasm.md, section 5), where a backend
# exists and runtime codegen is allowed (64-bit x86 and arm, not iOS); the
# wasmtime dependency is declared for those targets only, so elsewhere
# (armeabi-v7a, x86 Android, iOS) the feature resolves to wasmi. Exactly one
# engine is compiled in: build.rs turns the feature plus the target into the
# `wasm_native` cfg, which picks the backend module and cfg's the other out
# (wasmi stays a dependency, but unreferenced, so the linker drops it).
wasm-native = ["wasm", "dep:wasmtime"]

[dependencies]
log = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "fs", "io-util", "macros", "rt", "net", "signal", "process"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
# The digest core behind crypto.subtle.digest.
sha2 = "=0.11.1"
# forge::compression (CompressionStream / DecompressionStream): deflate, the
# zlib format and the gzip framing's CRC-32, on the pure-Rust backend. Already
# in the tree (image -> png depends on it).
flate2 = "=1.1.10"
bytes = "=1.12.1"
futures-core = "=0.3.34"
# Jitter for the fetch 429 backoff. Already in the tree (tokio and others
# depend on it).
fastrand = "=2.5.0"
# Entry file names for forge::cache (hash of the cache key). Already in the
# tree (iroh depends on it).
blake3 = "=1.8.7"
# ReaderStream: cached entry file -> ByteStream for forge::cache lookups;
# CancellationToken (no feature needed): close of a forge::source pump.
# Already in the tree (hyper-util/iroh depend on it).
tokio-util = { version = "=0.7.20", features = ["io"] }
# The fetch cache's metadata blob (response snapshot stored next to the body).
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
percent-encoding = "=2.3.2"
# Raw terminal mode and key events for forge::tty (a safe binding crate:
# termios on unix, the Console API on Windows). No event-stream: keys are
# read blocking on the stdin reader thread.
crossterm = { version = "=0.29.0", default-features = false, features = ["windows", "events"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "hooks"] }
path-clean = "=1.0.1"
# Glob patterns for forge::path::matches_glob and the forge::fs::glob scan
# (flux:path matchesGlob, flux:fs glob): the rust-lang crate, no dependencies.
glob = "=0.3.4"
# Directory change notifications for forge::fs::DirWatcher (flux:fs dir().watch):
# inotify / FSEvents / ReadDirectoryChangesW behind one API. No crossbeam
# channel feature: events cross to the caller on a tokio channel.
notify = { version = "=8.2.0", default-features = false, features = ["macos_fsevent"] }
# Current-process stats for flux:process (memoryUsage rss).
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
fastwebsockets = { version = "=0.10.0", features = ["upgrade", "unstable-split"] }
# The p2p core behind `p2p` (forge::p2p).
iroh = { version = "=1.3.0", optional = true }
# The relay's access token behind `p2p-relay`: a fresh secret key's bytes,
# from the CSPRNG iroh draws its own keys from. `key` is what iroh-relay
# turns on already, so this adds nothing to the tree.
iroh-base = { version = "=1.3.0", default-features = false, features = ["key"], optional = true }
# The relay server behind `p2p-relay`. `default-features = false` as iroh
# declares the crate; `server` is the HTTP relay, and the metrics and ring
# TLS it implies are what iroh picks for the client half too.
iroh-relay = { version = "=1.3.0", default-features = false, features = ["server"], optional = true }
# Cross-platform PATH lookup for the subprocess `which` (handles Windows PATHEXT).
which = "=8.0.6"
# UDP socket options the flux:net multicast beacon needs (SO_REUSEADDR/REUSEPORT)
# that tokio's UdpSocket::bind doesn't expose: bind via socket2, then adopt with
# UdpSocket::from_std. Already in the tree (tokio depends on it).
socket2 = "=0.6.5"
# DNS message codec for flux:mdns (mDNS / DNS-SD). Shared with iroh's deps
# while `p2p` is on; default features (std only) cover build + parse.
hickory-proto = "=0.26.3"
# Cross-platform interface enumeration (name / IPv4+prefix / MAC / flags) for
# flux:net interfaces() - the no-subprocess replacement for parsing `ip addr`.
# Shared with iroh's deps while `p2p` is on.
netdev = "=0.46.3"
# URL parsing for the relay token a relay URL carries as its user part
# (forge::p2p), behind `p2p` and `p2p-relay`. Already in the tree (iroh depends on it).
url = { version = "=2.5.8", optional = true }
# Pure-Rust, no-JIT wasm interpreter behind forge::wasm (flux:wasm), the
# `wasm` feature: the lane on the targets that cannot run generated code. No
# per-platform native build or signing story: one .wasm runs on every target.
# The default `wat` feature also accepts text-format sources, handy for tests
# and small inline modules. `simd` (also relaxed-simd) so modules compiled
# with SIMD validate; v128 still never crosses the host boundary.
wasmi = { version = "=2.0.0", features = ["simd"], optional = true }
# Full SVG document parsing/normalization for forge::svg / parseSvg (resolves
# CSS, transforms, use/defs, gradients into a flat path tree). default-features
# off drops the text/font stack (fontdb, rustybuzz, unicode-*); we only emit
# the normalized geometry as plain data, never rasterize, so resvg/tiny-skia
# are not pulled.
usvg = { version = "=0.48.1", default-features = false }
# forge::image (flux:image decodeImage/encodeImage): the practical web decode
# set; png + jpeg also encode. avif decode is deliberately absent (the image
# crate only encodes avif in pure Rust; decoding needs the dav1d C system
# dependency), see okf/backlog/avif-decode.md.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }

# forge::audio and forge::video have no crate dependencies of their own: the
# WebM reader is ours (src/video/webm.rs), the WAV reader is ours
# (src/audio/wav.rs), and the codec libraries are libopus, libogg with
# libopusfile and (off Android) libvpx, all vendored as submodules and bound
# by hand (src/audio/opus, src/audio/opusfile, src/video/vpx): no wrapper
# crates, see CLAUDE.md on dependency reliability.

# forge::video's Android decoder: AMediaCodec in buffer mode. Same ndk crate
# alloy uses; api-level-26 matches the oldest target (the Philips TV), so no
# 28+ gated calls. ndk-sys only for the AMEDIACODEC_BUFFER_FLAG_* constants.
[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "=0.9.0", default-features = false, features = ["media", "api-level-26"], optional = true }
ndk-sys = { version = "=0.6.0", optional = true }
# forge::fs's content providers (src/fs/content.rs): the ContentResolver
# behind a `content://` URI a file dialog picked, reached over JNI on the
# process-wide JavaVM and activity alloy publishes in ndk-context. The same
# pins as alloy's, so the unified build compiles no extra crate.
jni = "=0.22.4"
ndk-context = "=0.1.1"

# The native wasm engine behind `wasm-native`, on the targets Cranelift has
# a backend for and that allow runtime codegen; build.rs mirrors this
# condition as the `wasm_native` cfg, and the two must agree. Lean feature
# set: no component model, async, GC, backtrace symbolication or parallel
# compilation; `wat` so text sources parse on this lane too. Measured at
# +7.8 MB of runtime.
[target.'cfg(all(any(target_arch = "x86_64", target_arch = "aarch64"), not(target_os = "ios")))'.dependencies]
wasmtime = { version = "=49.0.3", default-features = false, features = ["runtime", "std", "cranelift", "wat"], optional = true }

# The foreground-job check behind forge::tty::is_terminal (tcgetpgrp /
# getpgrp, safe wrappers), and CLOCK_MONOTONIC for forge::video's transport
# clock (the clock Android's releaseOutputBufferAtTime is expressed in).
# Already in the tree (which depends on it).
[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["termios", "process", "time"] }

# glibc's allocator settings (forge::process::return_large_allocations).
# Already in the tree (alloy, flux).
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "=0.2.190"

# The crash line (forge::process::report_crashes): the last-chance exception
# filter, the faulting module's name, and a raw stderr write. The same pin
# as alloy's, already in the client's graph, so the unified build compiles
# no extra crate.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_LibraryLoader"] }

[build-dependencies]
# Locates the target C compiler (respecting cargo-ndk's CC_<target>) so the
# Android build can link clang_rt.builtins; see build.rs.
cc = "=1.8.0"
# Drives the vendored libopus's CMake project (build.rs); already in the tree
# (sdl3-sys builds SDL with it).
cmake = "=0.1.58"
