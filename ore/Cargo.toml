[package]
name = "ore"
version = "0.0.0"
edition = "2021"

[features]
# The window part of ore: what needs SDL's video subsystem (the window and
# its GL surface, the system theme, the file dialogs, the cursor and text
# input types, the GL library path). Enabled by alloy, flux's gui and lattice;
# headless flux leaves it out.
window = ["dep:objc2-core-video", "dep:objc2-core-foundation", "dep:windows", "dep:libloading"]

# SDL, built from source as alloy builds it: per target, the same pin and
# features, so the two crates unify on one SDL in a GUI build.
[target.'cfg(target_os = "android")'.dependencies]
sdl3 = { version = "=0.22.1", features = ["build-from-source"] }
# The activity's helpers (src/android.rs: the share sheet, the touchscreen
# feature, the packed asset lookup; src/dialog/android.rs: the document
# intents), over JNI on the process-wide JavaVM and activity that
# src/android.rs publishes in ndk-context; the jni pin is forge's, so the
# unified build compiles no extra crate.
jni = "=0.22.4"
ndk-context = "=0.1.1"
# The APK's AAssetManager for the packed asset lookup (src/android.rs): ndk
# the safe asset wrapper, ndk-sys the raw AAssetManager_fromJava. The
# display vsync source (src/display_vsync.rs): ndk the thread's looper,
# ndk-sys the raw AChoreographer_* calls the safe crate does not cover; both
# drop there if SDL ships its own choreographer API (libsdl-org/SDL#15013).
# The video plane's NativeWindow (src/video_plane.rs), ndk's. forge's pins.
ndk = { version = "=0.9.0", default-features = false }
ndk-sys = "=0.6.0"

[target.'cfg(target_os = "macos")'.dependencies]
sdl3 = { version = "=0.20.0", features = ["build-from-source-static"] }
# CVDisplayLink for the macOS swap pacer (src/gl_surface/display_link.rs): the
# ANGLE-Metal swap does not block, so the window swap waits for the link's
# tick, as SDL's own CGL path does. Generated CoreVideo bindings from the
# objc2 family, the same publisher and version as the objc2-* crates already
# in the client's graph (sysinfo, netdev, iroh); objc2-core-foundation for
# the CFRetained handle. Four functions used.
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["CVBase", "CVReturn", "CVDisplayLink", "CVHostTime"], optional = true }
objc2-core-foundation = { version = "=0.3.2", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
sdl3 = { version = "=0.20.0", features = ["build-from-source-static"] }

[target.'cfg(target_os = "windows")'.dependencies]
sdl3 = { version = "=0.20.0", features = ["build-from-source-static"] }
# GetDeviceRemovedReason on the D3D11 device behind ANGLE, for the context-
# loss log line (src/gl_surface/device_loss.rs): the DXGI_ERROR_* names and the COM
# interface. Already in the client's graph (iroh's netwatch pulls it), so
# the unified build compiles no extra crate.
windows = { version = "=0.62.2", features = ["Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi"], optional = true }

# A reference of our own on ANGLE's GL libraries for the process life
# (pin_gl_libraries in src/window/open.rs), so a window recreated after a
# context loss does not unload and reload them. alloy's pin.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
libloading = { version = "=0.9.0", optional = true }

[dependencies]
log = { workspace = true }
# The single-instance link listener (src/link/instance.rs): a Unix domain
# socket or a named pipe, served on the host's runtime.
tokio = { workspace = true, features = ["io-util"] }

# The per-user protocol registration a packed app writes on
# registerProtocolHandler (src/link/registration.rs), through Microsoft's
# safe registry binding; already in the graph (ipconfig, the resolver's
# Windows DNS config).
[target.'cfg(windows)'.dependencies]
windows-registry = "=0.6.1"
# GetCurrentThread/SetThreadPriority for the frame tiers (src/threads.rs),
# the Windows half of what libc covers on unix. Already in the graph via
# tokio/rustix/socket2, and socket2 already enables this feature, so the
# unified build compiles no extra crate.
windows-sys = { version = "=0.61.2", features = ["Win32_System_Threading"] }

# setpriority/gettid, sched_setattr and sched_setaffinity (Android/Linux)
# and QoS classes (macOS) for thread placement (src/threads.rs), and
# clock_gettime(CLOCK_MONOTONIC) on Android for the touch and vsync frame-time
# clocks (src/touch.rs, src/display_vsync.rs); alloy's and forge's pin.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[build-dependencies]
# Locates the target C compiler so the macOS build can link
# libclang_rt.osx.a; see build.rs. forge's pin, already in the tree.
cc = "=1.10.0"
