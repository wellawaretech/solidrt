plugins {
     id 'com.android.application'
}

// The published Player is built only by `make android-dist PUBLISH=1`
// (-PsrtPublish), which the release workflow runs: its release build is
// com.solidrt.player, labelled Player and signed with the Player key - the
// Player's permanent identity, the only build that can update an installed
// published Player. Every other player build is the dev Player,
// com.solidrt.player.dev, labelled Player.dev and signed with the debug key,
// so a local build never collides with the published one. The key comes from
// the environment (the workflow decodes it from a secret) as a PKCS12
// keystore with one password for store and key; publishing without it fails
// here rather than signing a published Player with the debug key.
def publish = project.hasProperty('srtPublish')
def playerKeystore = System.getenv('SRT_PLAYER_KEYSTORE')
if (publish && !playerKeystore) {
    throw new GradleException('PUBLISH=1 (-PsrtPublish) needs the Player key: set SRT_PLAYER_KEYSTORE and SRT_PLAYER_KEYSTORE_PASSWORD')
}

android {
    namespace = "com.solidrt.app"
    compileSdk = 36
    buildToolsVersion = "36.1.0"
    ndkVersion = "29.0.14206865"
    defaultConfig {
        minSdk = 26
        targetSdk = 36
        versionCode = 1
        versionName = "1.0"
        // Restrict the packaged native libs to one ABI when -PsrtAbi is passed
        // (e.g. the 32-bit single-ABI dist target). Absent, every ABI staged
        // under dist/android is bundled, which is the fat-APK default.
        if (project.hasProperty('srtAbi')) {
            ndk {
                abiFilters.addAll(project.property('srtAbi').split(',').toList())
            }
        }
        // The build's version (-PsrtVersion, make's VERSION): versionName is
        // what `srt android` compares against the project's
        // @solidrt/android-<abi> package, versionCode orders updates. A
        // version without a leading x.y.z (a branch name, in a dry-run
        // release) keeps versionCode 1.
        if (project.hasProperty('srtVersion')) {
            def version = project.property('srtVersion').toString()
            versionName = version
            def release = version =~ /^(\d+)\.(\d+)\.(\d+)/
            if (release.find()) {
                versionCode = release.group(1).toInteger() * 1000000 + release.group(2).toInteger() * 1000 + release.group(3).toInteger()
            }
        }
    }
    // Explicit debug signing key, checked into the repo. Without this, AGP
    // auto-generates ~/.android/debug.keystore per machine, so a build from
    // one checkout cannot reinstall over another's. A fixed key (standard
    // debug alias/password, not sensitive) keeps local builds interchangeable.
    // It signs every build but the published Player, the runner included
    // (which `srt pack --apk` re-signs anyway).
    signingConfigs {
        debug {
            storeFile = file('debug.keystore')
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
        if (publish) {
            player {
                storeFile = file(playerKeystore)
                storeType = 'pkcs12'
                storePassword = System.getenv('SRT_PLAYER_KEYSTORE_PASSWORD')
                keyAlias = System.getenv('SRT_PLAYER_KEY_ALIAS') ?: 'solidrt-player'
                keyPassword = System.getenv('SRT_PLAYER_KEYSTORE_PASSWORD')
            }
        }
    }
    // Release signing is per flavor; the debug build type keeps its own
    // debug key, which takes precedence over a flavor's.
    flavorDimensions = ["variant"]
    productFlavors {
        player {
            dimension = "variant"
            // The dev Player; onVariants below turns the published release
            // build into com.solidrt.player. The label reaches the manifest
            // through src/player/AndroidManifest.xml.
            applicationId = "com.solidrt.player.dev"
            manifestPlaceholders.put('playerLabel', 'Player.dev')
            signingConfig = publish ? signingConfigs.player : signingConfigs.debug
        }
        runner {
            dimension = "variant"
            // The runner: a placeholder id (and label, "Runner") that `srt
            // pack --apk` rewrites to the app's own. Its link scheme in
            // src/runner/AndroidManifest.xml is spelled the same, so the
            // rewrite renames both.
            applicationId = "com.solidrt.runner"
            signingConfig = signingConfigs.debug
        }
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // Native libs and assets are per flavor, not on main: flavor sourceSets
    // add to main's, so anything staged here for the Player would also land
    // in the runner APK. The Player carries the player assets (extracted at
    // launch by its MainActivity); the runner APK carries no assets of its
    // own - `srt pack --apk` injects the app payload into a copy.
    sourceSets {
        player {
            jniLibs.srcDir '../../../dist/android'
            assets.srcDirs = ['../../../dist/assets']
        }
        runner {
            jniLibs.srcDir '../../../dist/android-runtime'
        }
    }
    lint {
        abortOnError = false
    }
}

// The runner ships its native libs deflated (extractNativeLibs=true): the
// runner APK is direct distribution, where the wire is the file, so
// download size wins over the extracted on-device copy (40.8 -> ~17 MB
// measured; okf/backlog/standalone-android-apk.md). The Player keeps stored
// libs: it is delivered by tooling, and in-place mmap loads faster.
//
// The published Player (see the top of this file) is the player release
// build under -PsrtPublish; a debug build stays the dev Player even then.
androidComponents {
    onVariants(selector().all()) { variant ->
        if (variant.flavorName == 'runner') {
            variant.packaging.jniLibs.useLegacyPackaging.set(true)
        }
        if (publish && variant.flavorName == 'player' && variant.buildType == 'release') {
            variant.applicationId.set('com.solidrt.player')
            variant.manifestPlaceholders.put('playerLabel', 'Player')
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
