plugins {
     id 'com.android.application'
}

android {
    namespace = "com.solidrt.app"
    compileSdkVersion 36
    buildToolsVersion "36.1.0"
    ndkVersion = "29.0.14206865"
    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
        // Restrict the packaged native libs to one ABI when -PsrtAbi is passed
        // (e.g. the 32-bit single-ABI dist target). Absent, every ABI staged
        // under dist/android is bundled, which is the fat-APK default.
        if (project.hasProperty('srtAbi')) {
            ndk {
                abiFilters.addAll(project.property('srtAbi').split(',').toList())
            }
        }
    }
    // Explicit debug signing key, checked into the repo. Without this, AGP
    // auto-generates ~/.android/debug.keystore per machine (and per CI run),
    // so every published APK is signed with a different key and reinstalling
    // over a prior build fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE. A
    // fixed key (standard debug alias/password, not sensitive) keeps upgrades
    // working across machines and releases. The debug build type uses this by
    // default; release references it explicitly below.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    flavorDimensions "variant"
    productFlavors {
        go {
            dimension "variant"
            applicationId "com.solidrt.go"
        }
        prod {
            dimension "variant"
            applicationId "com.solidrt.app"
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets.main {
        jniLibs.srcDir '../../../dist/android'
        assets.srcDirs = ['../../../dist/assets']
    }
    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
