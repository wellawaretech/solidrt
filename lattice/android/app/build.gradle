plugins {
     id 'com.android.application'
}

android {
    namespace = "com.solidrt.app"
    compileSdk = 36
    buildToolsVersion = "36.1.0"
    ndkVersion = "29.0.14206865"
    defaultConfig {
        minSdk = 26
        targetSdk = 36
        versionCode = 1
        versionName = "1.0"
        // Restrict the packaged native libs to one ABI when -PsrtAbi is passed
        // (e.g. the 32-bit single-ABI dist target). Absent, every ABI staged
        // under dist/android is bundled, which is the fat-APK default.
        if (project.hasProperty('srtAbi')) {
            ndk {
                abiFilters.addAll(project.property('srtAbi').split(',').toList())
            }
        }
        // The build's version (-PsrtVersion, make's VERSION): versionName is
        // what `srt android` compares against the project's
        // @solidrt/android-<abi> package, versionCode orders updates. A
        // version without a leading x.y.z (a branch name, in a dry-run
        // release) keeps versionCode 1.
        if (project.hasProperty('srtVersion')) {
            def version = project.property('srtVersion').toString()
            versionName = version
            def release = version =~ /^(\d+)\.(\d+)\.(\d+)/
            if (release.find()) {
                versionCode = release.group(1).toInteger() * 1000000 + release.group(2).toInteger() * 1000 + release.group(3).toInteger()
            }
        }
    }
    // Explicit debug signing key, checked into the repo. Without this, AGP
    // auto-generates ~/.android/debug.keystore per machine, so a build from
    // one checkout cannot reinstall over another's. A fixed key (standard
    // debug alias/password, not sensitive) keeps local builds interchangeable.
    // It signs every debug build and the runner (which `srt pack --apk`
    // re-signs anyway); never the published Player.
    //
    // The published Player's key is the Player's identity: only a build
    // signed with it can update an installed Player. It comes from the
    // environment (the release workflow decodes it from a secret) as a
    // PKCS12 keystore with one password for store and key; without it the go
    // release build falls back to the debug key, as every local build does.
    def playerKeystore = System.getenv('SRT_PLAYER_KEYSTORE')
    signingConfigs {
        debug {
            storeFile = file('debug.keystore')
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
        if (playerKeystore) {
            player {
                storeFile = file(playerKeystore)
                storeType = 'pkcs12'
                storePassword = System.getenv('SRT_PLAYER_KEYSTORE_PASSWORD')
                keyAlias = System.getenv('SRT_PLAYER_KEY_ALIAS') ?: 'solidrt-player'
                keyPassword = System.getenv('SRT_PLAYER_KEYSTORE_PASSWORD')
            }
        }
    }
    // Release signing is per flavor; the debug build type keeps its own
    // debug key, which takes precedence over a flavor's.
    flavorDimensions = ["variant"]
    productFlavors {
        go {
            dimension = "variant"
            // The Player's id: its identity with the Player key above, both
            // permanent. The flavor keeps its old name until go becomes player.
            applicationId = "com.solidrt.player"
            signingConfig = playerKeystore ? signingConfigs.player : signingConfigs.debug
        }
        prod {
            dimension = "variant"
            applicationId = "com.solidrt.app"
            signingConfig = signingConfigs.debug
        }
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // Native libs and assets are per flavor, not on main: flavor sourceSets
    // add to main's, so anything staged here for go would also land in the
    // prod runner APK. The go client carries the player assets (extracted
    // at launch by its MainActivity); the runner APK carries no assets of its
    // own - `srt pack --apk` injects the app payload into a copy.
    sourceSets {
        go {
            jniLibs.srcDir '../../../dist/android'
            assets.srcDirs = ['../../../dist/assets']
        }
        prod {
            jniLibs.srcDir '../../../dist/android-runtime'
        }
    }
    lint {
        abortOnError = false
    }
}

// The prod runner ships its native libs deflated (extractNativeLibs=true):
// the runner APK is direct distribution, where the wire is the file, so
// download size wins over the extracted on-device copy (40.8 -> ~17 MB
// measured; okf/backlog/standalone-android-apk.md). The go client keeps
// stored libs: it is delivered by tooling, and in-place mmap loads faster.
androidComponents {
    onVariants(selector().all()) { variant ->
        if (variant.flavorName == 'prod') {
            variant.packaging.jniLibs.useLegacyPackaging.set(true)
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
