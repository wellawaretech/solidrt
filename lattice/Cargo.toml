[package]
name = "lattice"
version = "0.0.0"
edition = "2021"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "solidrt-go"
path = "src/main.rs"
required-features = ["go"]

[[bin]]
name = "solidrt"
path = "src/main.rs"

[features]
#TODO drop the default compile
default = ["flux/compile"]
go = ["flux/compile", "dep:forge", "dep:tokio-websockets", "dep:futures-util", "dep:http", "dep:serde", "dep:serde_json", "dep:reqwest", "dep:base64", "dep:sha2"]
# Speech recognition: Whisper transcription (whisper.cpp via whisper-rs, CPU
# inference) plus wake word detection (livekit-wakeword, ONNX via tract).
# Opt-in: not part of `default` so a plain `cargo build` stays voice-free.
speech = ["dep:whisper-rs", "dep:livekit-wakeword"]

[dependencies]
alloy = { workspace = true }
log = { workspace = true }
# gui is always on: lattice is the renderer, so the alloy-backed flux::gui
# bindings are needed in every build config (incl. the --no-default-features
# runtime and go builds). `compile` is selected per-build via --features.
flux = { workspace = true, default-features = false, features = ["gui"] }
# The go client's p2p tunnel (src/go/tunnel.rs) dials tickets with the same
# engine-free core flux:p2p marshals.
forge = { workspace = true, optional = true }
half = "2.7.1"
rquickjs = { workspace = true }
# taffy stays: the properties plugins assign taffy Style directly. The render
# tree (and its lyon/svgtypes path deps) moved to alloy.
taffy = "0.12.1"
# decodeImage formats: the practical web set. avif decode is deliberately
# absent (image only encodes avif in pure Rust; decoding needs the dav1d C
# system dependency), see okf/backlog/avif-decode.md.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }
base64 = { version = "0.22", optional = true }
tokio = { workspace = true }
tokio-websockets = { version = "0.13", features = ["client", "fastrand", "sha1_smol"], optional = true }
futures-util = { version = "0.3", features = ["sink"], optional = true }
http = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# Version-store integrity: manifest hash = version id, bundle hash verify
# (src/go/store.rs). go-only until packed apps read the store (stage 4).
sha2 = { version = "0.10", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
whisper-rs = { version = "0.16", features = ["log_backend"], optional = true }
livekit-wakeword = { version = "0.1", optional = true }

# Process stats for the debug overlay: RSS via sysinfo, CPU% via cpu_time.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
cpu-time = "1"

# mDNS / DNS-SD dev-server discovery for the go client (see src/go/connection.rs).
# Android reaches the dev server via the adb-reverse loopback instead, and
# receiving mDNS there would need a WifiManager.MulticastLock, so it is excluded.
[target.'cfg(not(target_os = "android"))'.dependencies]
mdns-sd = "0.20"
