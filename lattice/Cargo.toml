[package]
name = "lattice"
version = "0.0.0"
edition = "2021"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "solidrt-go"
path = "src/main.rs"
required-features = ["go"]

[[bin]]
name = "solidrt"
path = "src/main.rs"

[features]
#TODO drop the default compile
default = ["flux/compile"]
go = ["flux/compile", "dep:tokio-websockets", "dep:futures-util", "dep:http", "dep:serde", "dep:serde_json", "dep:reqwest"]

[dependencies]
alloy = { workspace = true }
log = { workspace = true }
flux = { workspace = true, default-features = false }
half = "2.7.1"
rquickjs = { workspace = true }
taffy = "0.10.1"
svgtypes = "0.16"
lyon_path = "1"
lyon_algorithms = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tokio = { workspace = true }
tokio-websockets = { version = "0.13", features = ["client", "fastrand", "sha1_smol"], optional = true }
futures-util = { version = "0.3", features = ["sink"], optional = true }
http = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }

# mDNS / DNS-SD dev-server discovery for the go client (see src/go/connection.rs).
# Android reaches the dev server via the adb-reverse loopback instead, and
# receiving mDNS there would need a WifiManager.MulticastLock, so it is excluded.
[target.'cfg(not(target_os = "android"))'.dependencies]
mdns-sd = "0.20"
