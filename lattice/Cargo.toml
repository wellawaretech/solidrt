[package]
name = "lattice"
version = "0.0.0"
edition = "2021"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "solidrt-go"
# Same program as `solidrt` below; the shim exists only because cargo warns
# when two targets share one source file. The real difference is the feature.
path = "src/main_go.rs"
required-features = ["go"]

[[bin]]
name = "solidrt"
path = "src/main.rs"

[features]
#TODO drop the default compile
default = ["flux/compile"]
go = ["flux/compile", "dep:tokio-websockets", "dep:futures-util", "dep:http", "dep:reqwest", "dep:base64", "dep:sha2", "dep:resvg"]
# Speech recognition: Whisper transcription (whisper.cpp via whisper-rs, CPU
# inference) plus wake word detection (livekit-wakeword, ONNX via tract).
# Opt-in: not part of `default` so a plain `cargo build` stays voice-free.
speech = ["dep:whisper-rs", "dep:livekit-wakeword"]
# Passthrough: video frame scheduling on the paced timeline (see flux).
video-timeline-pacing = ["flux/video-timeline-pacing"]

[dependencies]
alloy = { workspace = true }
log = { workspace = true }
# gui is always on: lattice is the renderer, so the alloy-backed flux::gui
# bindings are needed in every build config (incl. the --no-default-features
# runtime and go builds). `compile` is selected per-build via --features.
flux = { workspace = true, default-features = false, features = ["gui"] }
# Every build: the assets mount (forge::fs::set_assets_base) plus, for the go
# client, the p2p tunnel core flux:p2p marshals. Already in the tree via flux.
forge = { workspace = true }
half = "2.7.1"
rquickjs = { workspace = true }
# taffy stays: the properties plugins assign taffy Style directly. The render
# tree (and its lyon/svgtypes path deps) moved to alloy.
taffy = "0.12.1"
base64 = { version = "0.22", optional = true }
tokio = { workspace = true }
tokio-websockets = { version = "0.13", features = ["client", "fastrand", "sha1_smol"], optional = true }
futures-util = { version = "0.3", features = ["sink"], optional = true }
http = { version = "1", optional = true }
# Every build since stage 3b: the packed runner reads manifest.json (folder
# boot, src/manifest.rs); stage 4 OTA needs it in packed apps anyway.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
# Version-store integrity: manifest hash = version id, bundle hash verify
# (src/go/store.rs). go-only until packed apps read the store (stage 4).
sha2 = { version = "0.10", optional = true }
# Window icon rasterization (src/go/icon.rs): SVG source -> RGBA pixels for
# SDL_SetWindowIcon. Deliberately go-only so the production runtime stays
# raster-free (packed apps get icons from platform packaging, stage 3); same
# usvg underneath as forge's geometry-only dep (forge::svg), so no second SVG
# parser.
resvg = { version = "0.47", default-features = false, optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
whisper-rs = { version = "0.16", features = ["log_backend"], optional = true }
livekit-wakeword = { version = "0.1", optional = true }

# Process stats for the debug overlay: RSS via sysinfo, CPU% via cpu_time.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
cpu-time = "1"

# mDNS / DNS-SD dev-server discovery for the go client (see src/go/connection.rs).
# Android reaches the dev server via the adb-reverse loopback instead, and
# receiving mDNS there would need a WifiManager.MulticastLock, so it is excluded.
[target.'cfg(not(target_os = "android"))'.dependencies]
mdns-sd = "0.20"
